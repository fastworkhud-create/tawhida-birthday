<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#130b2b" />
  <meta name="description" content="A little birthday universe made especially for Tawhida." />
  <title>Tawhida Birthday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --pink:#ff4f91; --peach:#ffb86b; --cream:#fff8f1; --ink:#fff; }
    * { box-sizing: border-box; }
    html,body { margin:0; min-height:100%; background:#090615; color:var(--ink); font-family:'DM Sans',sans-serif; }
    body { overflow:hidden; }
    #space { position:fixed; inset:0; width:100%; height:100%; display:block; }
    .aurora { position:fixed; inset:-20%; pointer-events:none; opacity:.6; filter:blur(70px); background:radial-gradient(circle at 30% 25%,rgba(255,79,145,.2),transparent 32%),radial-gradient(circle at 72% 72%,rgba(126,91,255,.22),transparent 34%); }
    .vignette { position:fixed; inset:0; pointer-events:none; background:radial-gradient(circle at center,transparent 20%,rgba(4,2,13,.48) 100%); }
    .content { position:relative; z-index:2; min-height:100vh; display:grid; place-items:center; text-align:center; padding:24px; pointer-events:none; }
    .card { max-width:760px; padding:30px 24px 24px; animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { margin:0 0 18px; text-transform:uppercase; letter-spacing:.38em; font-size:11px; color:rgba(255,248,241,.7); }
    h1 { margin:0; font-family:'Playfair Display',serif; font-size:clamp(4rem,13vw,9.2rem); line-height:.88; letter-spacing:-.055em; font-weight:800; background:linear-gradient(115deg,#fff8f1 15%,#ffd2df 48%,#ff8eb8 82%); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 18px 50px rgba(255,79,145,.16); }
    h1 span { display:block; font-size:.48em; letter-spacing:-.03em; margin-top:16px; background:linear-gradient(115deg,#ffca9a,#ff579b); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .message { margin:34px auto 0; max-width:520px; color:rgba(255,248,241,.84); font-size:clamp(15px,2.3vw,19px); line-height:1.7; }
    .message b { color:#fff; font-weight:700; }
    .heart { display:inline-block; color:#ff699f; animation:beat 1.45s ease-in-out infinite; }
    .button { pointer-events:auto; margin-top:30px; border:1px solid rgba(255,255,255,.25); border-radius:999px; color:#fff; background:rgba(255,255,255,.1); backdrop-filter:blur(14px); padding:13px 22px; font:500 14px 'DM Sans',sans-serif; cursor:pointer; transition:.25s ease; box-shadow:0 10px 35px rgba(0,0,0,.18); }
    .button:hover { transform:translateY(-2px); background:rgba(255,255,255,.17); border-color:rgba(255,255,255,.45); }
    .button:active { transform:scale(.97); }
    .signature { margin-top:28px; color:rgba(255,248,241,.5); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    .sparkle { position:absolute; width:4px; height:4px; border-radius:50%; background:#fff; box-shadow:0 0 14px 4px rgba(255,190,220,.9); animation:twinkle var(--d) ease-in-out infinite; opacity:.65; }
    @keyframes rise { from { opacity:0; transform:translateY(26px) scale(.98); } to { opacity:1; transform:none; } }
    @keyframes beat { 0%,100% { transform:scale(1); } 50% { transform:scale(1.18); } }
    @keyframes twinkle { 0%,100% { opacity:.18; transform:scale(.7); } 50% { opacity:1; transform:scale(1.5); } }
    @media (max-width:520px) { .card { padding:20px 8px; } .message { margin-top:27px; } .button { margin-top:25px; } }
  </style>
</head>
<body>
  <canvas id="space" aria-hidden="true"></canvas>
  <div class="aurora"></div><div class="vignette"></div>
  <div class="sparkle" style="left:12%;top:22%;--d:2.4s"></div><div class="sparkle" style="left:82%;top:18%;--d:3.1s"></div><div class="sparkle" style="left:18%;top:78%;--d:2.8s"></div><div class="sparkle" style="left:88%;top:72%;--d:2.1s"></div>
  <main class="content">
    <section class="card">
      <p class="eyebrow">A little universe made for you</p>
      <h1>Happy Birthday<span>Tawhida</span></h1>
      <p class="message">May your day be filled with <b>soft moments</b>, bright surprises, and every beautiful thing your heart wishes for. Keep shining, keep smiling, and never forget how wonderfully special you are <span class="heart">♥</span></p>
      <button class="button" id="celebrate" type="button">Tap to make a wish ✦</button>
      <p class="signature">With warmest wishes</p>
    </section>
  </main>
  <script>
    const canvas = document.getElementById('space'), ctx = canvas.getContext('2d');
    let w, h, dpr, particles = [], burst = [];
    const colors = ['#ff83b2','#ffb36b','#ffd8e7','#b9a3ff','#fff8f1'];
    function resize(){ dpr=Math.min(devicePixelRatio||1,2); w=innerWidth; h=innerHeight; canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width=w+'px'; canvas.style.height=h+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); }
    function seed(){ particles=Array.from({length:Math.min(190,Math.floor(innerWidth/5))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.7+.25,a:Math.random()*.7+.15,s:Math.random()*.15+.04})); }
    function heartPoint(t,scale){ return {x:16*Math.sin(t)**3*scale, y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*scale}; }
    function celebrate(){
      for(let i=0;i<100;i++){ const t=Math.random()*Math.PI*2, p=heartPoint(t,Math.min(w,h)/38); burst.push({x:w/2+p.x,y:h/2+p.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5-1,life:1,c:colors[i%colors.length],r:Math.random()*3+1}); }
      const b=document.getElementById('celebrate'); b.textContent='Wish sent into the stars ✦'; setTimeout(()=>b.textContent='Tap to make a wish ✦',2600);
    }
    function draw(){
      ctx.clearRect(0,0,w,h); ctx.fillStyle='rgba(9,6,21,.32)'; ctx.fillRect(0,0,w,h);
      particles.forEach(p=>{ p.y-=p.s; if(p.y<0)p.y=h; ctx.beginPath(); ctx.fillStyle=`rgba(255,255,255,${p.a})`; ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); });
      burst=burst.filter(p=>p.life>0); burst.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.life-=.012;ctx.beginPath();ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.shadowBlur=12;ctx.shadowColor=p.c;ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}); ctx.globalAlpha=1;ctx.shadowBlur=0; requestAnimationFrame(draw);
    }
    addEventListener('resize',()=>{resize();seed();}); document.getElementById('celebrate').addEventListener('click',celebrate); resize();seed();draw();
  </script>
</body>
</html>
